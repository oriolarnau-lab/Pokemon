<meta name="mobile-web-app-capable" content="yes">

<title>Col·lecció IR / SIR</title>
<style>
:root{
  --bg:#14161c;--card:#1e222b;--card2:#272c38;--txt:#eef0f4;--mut:#9aa3b2;
  --acc:#ffcb05;--ok:#3ddc84;--line:#2f3542;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:light){
  :root{--bg:#f3f4f7;--card:#fff;--card2:#e9ebf0;--txt:#161922;--mut:#626b7b;--acc:#c98f00;--ok:#16a34a;--line:#d9dce3}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding-bottom:calc(24px + var(--sab))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--sat)) 14px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:var(--card2);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
button.icon{padding:8px 10px;font-size:17px;line-height:1}
button.on{background:var(--acc);color:#14161c;font-weight:600}
input[type=search]{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;-webkit-appearance:none}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
main{padding:12px 12px 0}
.sets{display:grid;grid-template-columns:1fr;gap:8px}
.set{background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.set .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.set .t span:last-child{color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums}
.set.done .t span:last-child{color:var(--ok)}
.filters{display:flex;gap:8px;margin:2px 0 12px;overflow-x:auto}
.filters button{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(7,1fr)}}
.c{position:relative;background:var(--card);border-radius:10px;overflow:hidden;padding:0;text-align:left;display:block;width:100%}
.c .im{aspect-ratio:245/342;background:var(--card2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mut);padding:6px;position:relative}
.c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.55);transition:filter .2s}
.c.own img{filter:none}
.c .m{padding:5px 7px 6px;font-size:12px;line-height:1.2}
.c .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.c .m span{color:var(--mut)}
.chk{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid #fff8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.c.own .chk{background:var(--ok);border-color:#fff}
.c.own .chk::after{content:"✓"}
.zoom{position:absolute;bottom:44px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.sec{margin:16px 2px 8px;font-weight:700;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:none;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab));flex-direction:column;gap:12px}
.modal.show{display:flex}
.modal img{max-width:100%;max-height:72vh;border-radius:12px}
.modal .cap{color:#fff;text-align:center}
.sheet{background:var(--card);border-radius:16px;padding:16px;width:min(560px,100%);max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:18px}
.sheet p{color:var(--mut);font-size:14px;margin:6px 0}
textarea{width:100%;height:120px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:12px ui-monospace,monospace;padding:8px}
.sheet .row{margin-top:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
</style>
</head>

  <div class="row">
    <button class="icon" id="back" hidden aria-label="Enrere">‹</button>

  <input type="search" id="q" placeholder="Cerca un Pokémon…" autocomplete="off" autocapitalize="off" enterkeyhint="search">
</header>
<main id="main"></main>

<div class="modal" id="zoomModal"><img id="zoomImg" alt=""><div class="cap" id="zoomCap"></div><button id="zoomClose">Tanca</button></div>

  <textarea id="bkText" spellcheck="false"></textarea>

    <button id="bkLoad" class="on">Restaura des del text</button>
    <button id="bkClose">Tanca</button>
  </div>
</div></div>

const KEY = "pokemon-ir-sir-v1";
let owned = {};
try { owned = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { owned = {}; }

const $ = id => document.getElementById(id);
const cid = (s, c) => s.set + "#" + c.num + (c.dup ? "-" + c.dup : "");
// Marca duplicats d'un mateix número dins d'una expansió
DATA.forEach(s => { const seen = {}; s.cards.forEach(c => { seen[c.num] = (seen[c.num] || 0) + 1; if (seen[c.num] > 1) c.dup = seen[c.num]; }); });

function save(){ try { localStorage.setItem(KEY, JSON.stringify(owned)); } catch(e) { toast("No s'ha pogut desar en aquest navegador"); } }
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("show"),1800); }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function cnt(s){ let n=0; s.cards.forEach(c=>{ if(owned[cid(s,c)]) n++; }); return n; }
function hires(u){ return /images\.pokemontcg\.io/.test(u) ? u.replace(/\.png$/,"_hires.png") : u; }

let view = { set: null, filter: "all" };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function progress(n, tot){ $("sub").textContent = n + " de " + tot + " cartes (" + (tot?Math.round(100*n/tot):0) + " %)"; $("barfill").style.width = (tot?100*n/tot:0) + "%"; }

function render(){
  const q = norm($("q").value.trim());
  const main = $("main");
  $("back").hidden = !(view.set !== null || q);
  if (q) { renderSearch(q, main); return; }
  if (view.set === null) {
    $("title").textContent = "Col·lecció IR / SIR";
    let n=0,t=0; DATA.forEach(s=>{ n+=cnt(s); t+=s.cards.length; });
    progress(n,t);
    main.innerHTML = '<div class="sets">' + DATA.map((s,i)=>{
      const k=cnt(s), T=s.cards.length;
      return '<button class="set'+(k===T?' done':'')+'" data-i="'+i+'"><div class="t"><span>'+esc(s.set)+'</span><span>'+k+' / '+T+'</span></div><div class="bar"><i style="width:'+(100*k/T)+'%"></i></div></button>';
    }).join("") + '</div>';
    return;
  }
  const s = DATA[view.set];
  $("title").textContent = s.set;
  progress(cnt(s), s.cards.length);
  const list = s.cards.filter(c => view.filter==="all" || (view.filter==="own") === !!owned[cid(s,c)]);
  main.innerHTML =
    '<div class="filters">' + [["all","Totes"],["own","Les tinc"],["miss","Em falten"]].map(([k,l])=>'<button data-f="'+k+'" class="'+(view.filter===k?'on':'')+'">'+l+'</button>').join("") + '</div>' +
    (list.length ? '<div class="grid">' + list.map(c=>cardHTML(s,c,view.set)).join("") + '</div>' : '<div class="empty">Cap carta en aquest filtre.</div>');
}

function cardHTML(s, c, si){
  const id = cid(s,c), own = !!owned[id];
  return '<button class="c'+(own?' own':'')+'" data-si="'+si+'" data-id="'+esc(id)+'">' +
    '<div class="im">'+esc(c.n)+(c.img?'<img loading="lazy" decoding="async" src="'+esc(c.img)+'" alt="'+esc(c.n)+'" onerror="this.remove()">':'')+'</div>' +
    '<span class="chk"></span>' +
    '<span class="zoom" data-zoom="1" role="button" aria-label="Amplia">⤢</span>' +
    '<div class="m"><b>'+esc(c.n)+'</b><span>#'+c.num+'</span></div></button>';
}

function renderSearch(q, main){
  $("title").textContent = "Cerca";
  let hits = [];
  DATA.forEach((s,si)=>s.cards.forEach(c=>{ if(norm(c.n).includes(q)) hits.push([s,c,si]); }));
  let n=0; hits.forEach(([s,c])=>{ if(owned[cid(s,c)]) n++; });
  progress(n, hits.length);
  if(!hits.length){ main.innerHTML='<div class="empty">Cap resultat.</div>'; return; }
  const bySet = {}; hits.forEach(h=>(bySet[h[2]] = bySet[h[2]] || []).push(h));
  main.innerHTML = Object.keys(bySet).map(si=>'<div class="sec">'+esc(DATA[si].set)+'</div><div class="grid">'+bySet[si].map(([s,c])=>cardHTML(s,c,si)).join("")+'</div>').join("");
}

$("main").addEventListener("click", e=>{
  const z = e.target.closest("[data-zoom]");
  const card = e.target.closest(".c");
  if (z && card) { e.stopPropagation(); openZoom(card); return; }
  if (card) {
    const id = card.dataset.id;
    if (owned[id]) delete owned[id]; else owned[id] = 1;
    save();
    card.classList.toggle("own", !!owned[id]);
    // refresca només el progrés (sense redibuixar, per no perdre l'scroll)
    const q = norm($("q").value.trim());
    if (q) { let hits=0,n=0; DATA.forEach(s=>s.cards.forEach(c=>{ if(norm(c.n).includes(q)){hits++; if(owned[cid(s,c)]) n++;} })); progress(n,hits); }
    else if (view.set!==null) {
      progress(cnt(DATA[view.set]), DATA[view.set].cards.length);
      if (view.filter!=="all") setTimeout(render, 250);
    }
    return;
  }
  const sb = e.target.closest(".set");
  if (sb) { view.set = +sb.dataset.i; view.filter="all"; render(); scrollTo(0,0); return; }
  const fb = e.target.closest("[data-f]");
  if (fb) { view.filter = fb.dataset.f; render(); }
});

$("back").onclick = ()=>{ if ($("q").value) { $("q").value=""; } else { view.set=null; } render(); scrollTo(0,0); };
$("q").addEventListener("input", render);

function openZoom(card){
  const si = +card.dataset.si, s = DATA[si];
  const c = s.cards.find(c=>cid(s,c)===card.dataset.id);
  const img = $("zoomImg");
  $("zoomCap").textContent = c.n + " · " + s.set + " · #" + c.num;
  if (c.img) {
    img.hidden = false; img.src = hires(c.img);
    img.onerror = () => { img.onerror = () => { img.hidden = true; }; img.src = c.img; };
  } else { img.hidden = true; }
  $("zoomModal").classList.add("show");
}
$("zoomModal").onclick = e => { if (e.target.id==="zoomModal" || e.target.id==="zoomClose") $("zoomModal").classList.remove("show"); };

$("menu").onclick = () => { $("bkText").value = JSON.stringify({v:1, owned:Object.keys(owned)}); $("bkModal").classList.add("show"); };
$("bkClose").onclick = () => $("bkModal").classList.remove("show");
$("bkCopy").onclick = async () => {
  const t = $("bkText"); t.select();
  try { await navigator.clipboard.writeText(t.value); toast("Copiat"); } catch(e) { document.execCommand && document.execCommand("copy"); toast("Copiat"); }
};
$("bkLoad").onclick = () => {
  try {
    const o = JSON.parse($("bkText").value);
    if (!o || !Array.isArray(o.owned)) throw 0;
    owned = {}; o.owned.forEach(k => owned[k]=1);
    save(); $("bkModal").classList.remove("show"); render(); toast("Còpia restaurada (" + o.owned.length + " cartes)");
  } catch(e) { toast("El text no és una còpia vàlida"); }
};

render();
</script>

</html>
